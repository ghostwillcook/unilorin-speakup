# Netlify build for the UNILORIN SpeakUp web app.
#
# Only the Next.js app deploys here. server/socket.mjs CANNOT run on Netlify —
# Socket.io holds a long-lived connection and Netlify Functions, like any
# serverless runtime, are torn down between requests. The realtime server is
# deployed separately; see render.yaml and the Deployment section of README.md.
#
# Without the socket server the app degrades rather than breaks: complaints, the
# admin console and sign-in all work, direct messages fall back to
# GET/POST /api/dm/[studentId], and only the global chat room is unavailable.

[build]
  # `prisma generate` also runs from package.json's postinstall hook. It is
  # repeated here because the build image caches node_modules between deploys,
  # which means a cached install can skip postinstall and leave the previous
  # deploy's client in place after a schema change.
  command = "npx prisma generate && npm run build"
  # Declared explicitly and relatively. Left unset, the CLI resolves it to an
  # absolute path, which makes @netlify/plugin-nextjs treat the project as a
  # monorepo with a nested base directory and emit `/var/task/<name>` paths into
  # the generated function entry point.
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"
  # Prisma engine targets are declared in prisma/schema.prisma
  # (binaryTargets = ["native", "rhel-openssl-3.0.x"]) and that is the single
  # source of truth. The PRISMA_CLI_BINARY_TARGETS env var is intentionally NOT
  # set: Prisma 6.7+ rejects "native" as an env-var value ("Unknown binaryTarget
  # native"), and the schema already generates both the build machine's engine
  # and the rhel-openssl engine the Netlify Functions runtime (Amazon Linux)
  # needs.

[[plugins]]
  # The Next.js runtime: turns getServerSideProps and every /api route into
  # Netlify Functions. Pages Router is fully supported.
  package = "@netlify/plugin-nextjs"

[[plugins]]
  # MUST stay after @netlify/plugin-nextjs: it repairs the server handler that
  # plugin generates, and hooks run in declaration order, so listing it first
  # would run against a file that does not exist yet. A no-op on Linux; see
  # netlify/plugins/fix-windows-paths/index.js for why Windows needs it.
  package = "./netlify/plugins/fix-windows-paths"

# Attachment reads and the socket handshake token are per-user credentials that
# must never be held by Netlify's CDN. The routes already send Cache-Control
# themselves; this is the belt to that braces, in case a future edit drops it.
[[headers]]
  for = "/api/*"
  [headers.values]
    Cache-Control = "no-store, max-age=0"

# Security headers for every route, on top of the HSTS and
# X-Content-Type-Options: nosniff the platform already serves. Clickjacking:
# nothing in this app is ever legitimately framed, so DENY across the board.
# Referrer-Policy: strict-origin-when-cross-origin keeps a full URL (which can
# carry a complaint id or token in a query string) from leaking to whatever
# external sites the pages link out to, while still sending the origin so
# outbound analytics keep working. Deliberately NO Content-Security-Policy
# here: a CSP that breaks the Next.js runtime, inline styles, or the service
# worker would take the whole app down, and it cannot be written blind — it
# needs a manual pass against the real site's loaded resources first.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
